# Builds an UNSIGNED .ipa on a GitHub-hosted Mac, so you never need a Mac yourself.
# Download the artifact on Windows and sign + install it with Sideloadly (see README).
name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no code signing)
        run: |
          xcodebuild \
            -project TripperMaps.xcodeproj \
            -scheme TripperMaps \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TripperMaps.app Payload/
          zip -qry TripperMaps-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: TripperMaps-unsigned-ipa
          path: TripperMaps-unsigned.ipa
