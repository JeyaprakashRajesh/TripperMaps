name: TripperMaps
options:
  bundleIdPrefix: com.jeyaprakash
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TripperMaps:
    type: application
    platform: iOS
    sources:
      - App/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeyaprakash.trippermaps
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: App/Info.plist
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TripperMaps
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
        NSLocationWhenInUseUsageDescription: "Your position drives the map streamed to the Tripper Dash."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Keeps the dash map moving while your phone is locked in your pocket."
        NSLocalNetworkUsageDescription: "Talks to the Tripper Dash on the bike's Wi-Fi (192.168.1.1)."
    scheme: {}
